<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 기록 작성 - My Shelf</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="sub-header glass-panel">
      <a href="index.html" class="nav-back">✕ 취소</a>
      <h1 class="sub-title">새 게임 등록</h1>
      <div class="header-dummy"></div>
    </header>

    <!-- 입력 폼 -->
    <main class="form-container">
      <form id="recordForm" class="glass-form-card">
        <!-- 1. 플레이 날짜 입력 -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="playDate">플레이 날짜 (Date)</label>
            <span class="bgg-badge">기본 오늘</span>
          </div>
          <input 
            type="date" 
            id="playDate" 
            class="text-input glass-input" 
            required
          >
          <p class="input-tip">* 기본으로 오늘 날짜가 지정되며 변경할 수 있습니다.</p>
        </div>

        <!-- 2. 보드게임명 (실시간 BGG 검색) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="gameName">보드게임명 (Title)</label>
            <span class="bgg-badge">BGG 실시간</span>
          </div>
          <div class="autocomplete-wrapper">
            <input 
              type="text" 
              id="gameName" 
              class="text-input glass-input" 
              placeholder="영문 명칭 입력 (예: SETI, Brass, Catan...)" 
              autocomplete="off"
              required
            >
            <div id="bggResults" class="bgg-dropdown" style="display: none;"></div>
          </div>
          <p class="input-tip">* 게임을 선택하면 BGG의 실시간 난이도(Weight)가 자동 입력됩니다.</p>
        </div>

        <!-- 3. 인원 (2인 ~ 8인) -->
        <div class="input-group">
          <label class="input-label">인원 (2인~8인)</label>
          <div class="chip-container">
            <label class="chip-item"><input type="radio" name="players" value="2"><span>2인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="3"><span>3인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="4" checked><span>4인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="5"><span>5인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="6"><span>6인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="7"><span>7인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="8"><span>8인</span></label>
          </div>
        </div>

        <!-- 4. BGG 연동 난이도 점수 -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label">난이도 (BGG Weight 연동)</label>
            <span class="bgg-badge" id="weightBadge">선택 대기</span>
          </div>
          <div class="score-card-group">
            <label class="score-card">
              <input type="radio" name="difficulty" value="1">
              <div class="score-box glass-score">
                <span class="score-digit">1</span>
                <span class="score-name">쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="2">
              <div class="score-box glass-score">
                <span class="score-digit">2</span>
                <span class="score-name">약간 쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="3" checked>
              <div class="score-box glass-score">
                <span class="score-digit">3</span>
                <span class="score-name">보통</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="4">
              <div class="score-box glass-score">
                <span class="score-digit">4</span>
                <span class="score-name">어려움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="5">
              <div class="score-box glass-score">
                <span class="score-digit">5</span>
                <span class="score-name">최상</span>
              </div>
            </label>
          </div>
          <p class="input-tip" id="weightDesc">* 게임을 선택하면 BGG 실시간 평점에 맞춰 자동 체크됩니다.</p>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="button-group">
          <a href="index.html" class="btn btn-cancel">취소</a>
          <button type="submit" id="saveBtn" class="btn btn-save">저장하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgnPKokcM9NsFcqbQ4M5f_6TuhWwVtEwPdS-hmO-E7jmIieHBdU4nfgnWucHQgCrdjeA/exec";

    const input = document.getElementById('gameName');
    const dropdown = document.getElementById('bggResults');
    const form = document.getElementById('recordForm');
    const saveBtn = document.getElementById('saveBtn');
    const playDateInput = document.getElementById('playDate');
    const weightBadge = document.getElementById('weightBadge');
    const weightDesc = document.getElementById('weightDesc');

    // 오늘 날짜 세팅
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    playDateInput.value = `${yyyy}-${mm}-${dd}`;

    let debounceTimer = null;
    let currentSearchId = 0;

    // 타임아웃 지원 fetch
    async function safeFetch(url, timeoutMs = 5000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        return res;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    // 신뢰도 높은 안정 통신 함수
    async function requestBggText(targetBggUrl) {
      // 1순위: corsproxy.io (가장 안정적이고 제한이 적음)
      try {
        const res = await safeFetch(`https://corsproxy.io/?${encodeURIComponent(targetBggUrl)}`, 4000);
        if (res.ok) {
          const text = await res.text();
          if (text) return text;
        }
      } catch (e) {}

      // 2순위: allorigins raw 엔드포인트
      try {
        const res = await safeFetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetBggUrl)}`, 4000);
        if (res.ok) {
          const text = await res.text();
          if (text) return text;
        }
      } catch (e) {}

      throw new Error("BGG 프록시 통신 실패");
    }

    // 1. 실시간 보드게임 검색
    async function searchBgg(query) {
      const targetUrl = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
      const xmlText = await requestBggText(targetUrl);

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = xmlDoc.getElementsByTagName("item");

      const results = [];
      const limit = Math.min(items.length, 10);

      for (let i = 0; i < limit; i++) {
        const item = items[i];
        const id = item.getAttribute("id");
        const nameEl = item.getElementsByTagName("name")[0];
        const yearEl = item.getElementsByTagName("yearpublished")[0];

        if (nameEl && id) {
          results.push({
            id: id,
            name: nameEl.getAttribute("value"),
            year: yearEl ? yearEl.getAttribute("value") : ""
          });
        }
      }

      return results;
    }

    // 2. 실시간 BGG Weight 조회
    async function getBggWeight(bggId) {
      const targetUrl = `https://boardgamegeek.com/xmlapi2/thing?id=${bggId}&stats=1`;
      const xmlText = await requestBggText(targetUrl);

      const match = xmlText.match(/<averageweight\s+value="([^"]+)"/);
      if (match && match[1]) {
        const val = parseFloat(match[1]);
        if (!isNaN(val) && val > 0) {
          return val.toFixed(2);
        }
      }
      return null;
    }

    // 난이도 라디오 체크 및 문구 반영
    function applyDifficulty(scoreNum, rawWeight = null) {
      const scoreInt = Math.min(5, Math.max(1, Math.round(scoreNum)));
      const radio = document.querySelector(`input[name="difficulty"][value="${scoreInt}"]`);
      if (radio) {
        radio.checked = true;
      }

      if (rawWeight) {
        weightBadge.innerText = `BGG: ${rawWeight} / 5.0`;
        weightDesc.innerText = `* BGG 실시간 평균: ${rawWeight}점 (난이도 ${scoreInt}점으로 자동 선택되었습니다)`;
      } else {
        weightBadge.innerText = `선택: ${scoreInt}점`;
        weightDesc.innerText = `* 난이도 ${scoreInt}점으로 설정되었습니다.`;
      }
    }

    // 게임 목록 클릭 시 실행
    async function selectGame(item) {
      input.value = item.name;
      dropdown.style.display = 'none';

      weightBadge.innerText = "조회 중...";
      weightDesc.innerText = "* BGG 서버에서 최신 난이도(Weight)를 실시간으로 받아오는 중입니다...";

      if (!item.id) {
        applyDifficulty(3);
        weightBadge.innerText = "기본값";
        weightDesc.innerText = "* 게임 고유 ID가 없어 기본값(3점)으로 설정되었습니다. 원하는 점수를 직접 선택하세요.";
        return;
      }

      try {
        const weight = await getBggWeight(item.id);
        if (weight) {
          applyDifficulty(parseFloat(weight), weight);
        } else {
          applyDifficulty(3);
          weightBadge.innerText = "평점 없음";
          weightDesc.innerText = "* 해당 게임에 등록된 난이도 평점이 없습니다. 점수를 직접 선택하세요.";
        }
      } catch (err) {
        console.warn("난이도 통신 에러:", err);
        applyDifficulty(3);
        weightBadge.innerText = "직접 선택";
        weightDesc.innerText = "* BGG 통신이 지연되었습니다. 아래 1~5점 중 원하는 점수를 직접 터치해 주세요.";
      }
    }

    // 검색 결과 드롭다운 렌더링
    function renderDropdown(list) {
      if (!list || list.length === 0) {
        dropdown.innerHTML = '<div class="bgg-status">검색 결과가 없습니다. (직접 입력 가능)</div>';
        dropdown.style.display = 'block';
        return;
      }

      dropdown.innerHTML = '';
      const limit = Math.min(list.length, 8);

      for (let i = 0; i < limit; i++) {
        const item = list[i];
        const row = document.createElement("div");
        row.className = "bgg-item";
        row.innerHTML = `
          <span class="bgg-game-name">${escapeHtml(item.name)}</span>
          ${item.year ? `<span class="bgg-game-year">(${escapeHtml(item.year)})</span>` : ''}
        `;

        row.addEventListener("click", () => selectGame(item));
        dropdown.appendChild(row);
      }
      dropdown.style.display = 'block';
    }

    // 검색창 입력 이벤트 (디바운스 400ms)
    input.addEventListener('input', function() {
      const q = this.value.trim();
      clearTimeout(debounceTimer);

      if (q.length === 0) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      dropdown.innerHTML = '<div class="bgg-status">BGG에서 실시간 검색 중...</div>';
      dropdown.style.display = 'block';

      const thisSearchId = ++currentSearchId;

      debounceTimer = setTimeout(async () => {
        try {
          const results = await searchBgg(q);
          if (thisSearchId !== currentSearchId) return;
          renderDropdown(results);
        } catch (err) {
          if (thisSearchId !== currentSearchId) return;
          dropdown.innerHTML = '<div class="bgg-status">BGG 응답 지연 (직접 입력 후 등록 가능)</div>';
        }
      }, 400);
    });

    // 드롭다운 바깥 영역 클릭 시 닫기
    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // 난이도 라디오 수동 터치 시 배지 갱신
    document.querySelectorAll('input[name="difficulty"]').forEach(radio => {
      radio.addEventListener('change', function() {
        weightBadge.innerText = `수동: ${this.value}점`;
        weightDesc.innerText = `* 난이도 ${this.value}점으로 등록됩니다.`;
      });
    });

    // 스프레드시트 데이터 저장 (POST)
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const gameName = input.value.trim();
      const playDate = playDateInput.value;
      const players = document.querySelector('input[name="players"]:checked')?.value || "4";
      const difficulty = document.querySelector('input[name="difficulty"]:checked')?.value || "3";

      if (!gameName) {
        alert("보드게임명을 입력해 주세요.");
        return;
      }

      if (!playDate) {
        alert("플레이 날짜를 선택해 주세요.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            gameName: gameName,
            date: playDate,
            players: players,
            difficulty: difficulty
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("성공적으로 저장되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장 실패: " + (result.message || ""));
          saveBtn.disabled = false;
          saveBtn.innerText = "저장하기";
        }
      } catch (err) {
        alert("저장 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        saveBtn.disabled = false;
        saveBtn.innerText = "저장하기";
      }
    });

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
