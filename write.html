<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 기록 작성 - My Shelf</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="sub-header glass-panel">
      <a href="index.html" class="nav-back">✕ 취소</a>
      <h1 class="sub-title">새 게임 등록</h1>
      <div class="header-dummy"></div>
    </header>

    <!-- 입력 폼 -->
    <main class="form-container">
      <form id="recordForm" class="glass-form-card">
        <!-- 1. 플레이 날짜 입력 -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="playDate">플레이 날짜 (Date)</label>
            <span class="bgg-badge">기본 오늘</span>
          </div>
          <input 
            type="date" 
            id="playDate" 
            class="text-input glass-input" 
            required
          >
          <p class="input-tip">* 기본으로 오늘 날짜가 지정되며, 필요 시 변경할 수 있습니다.</p>
        </div>

        <!-- 2. 보드게임명 (실시간 BGG 검색) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="gameName">보드게임명 (Title)</label>
            <span class="bgg-badge">BGG 실시간</span>
          </div>
          <div class="autocomplete-wrapper">
            <input 
              type="text" 
              id="gameName" 
              class="text-input glass-input" 
              placeholder="영문 명칭 입력 (예: SETI, Brass, Catan...)" 
              autocomplete="off"
              required
            >
            <div id="bggResults" class="bgg-dropdown" style="display: none;"></div>
          </div>
          <p class="input-tip">* 목록에서 게임을 선택하면 BGG 현재 최신 Weight가 실시간 조회됩니다.</p>
        </div>

        <!-- 3. 인원 (2인 ~ 8인) -->
        <div class="input-group">
          <label class="input-label">인원 (2인~8인)</label>
          <div class="chip-container">
            <label class="chip-item"><input type="radio" name="players" value="2"><span>2인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="3"><span>3인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="4" checked><span>4인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="5"><span>5인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="6"><span>6인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="7"><span>7인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="8"><span>8인</span></label>
          </div>
        </div>

        <!-- 4. 실시간 BGG 최신 Weight -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="difficultyDisplay">난이도 (BGG 실시간 Weight / 5.0)</label>
            <span class="bgg-badge" id="weightBadge">대기 중</span>
          </div>
          <input 
            type="text" 
            id="difficultyDisplay" 
            class="text-input glass-input" 
            placeholder="게임을 선택하면 최신 BGG 수치를 가져옵니다" 
            readonly
            style="font-weight: 600; color: #1e293b;"
          >
          <input type="hidden" id="difficultyVal" name="difficulty" value="3">
          <p class="input-tip" id="weightDesc">* BGG 커뮤니티의 실시간 평균 난이도(Weight) 수치입니다.</p>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="button-group">
          <a href="index.html" class="btn btn-cancel">취소</a>
          <button type="submit" id="saveBtn" class="btn btn-save">저장하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgnPKokcM9NsFcqbQ4M5f_6TuhWwVtEwPdS-hmO-E7jmIieHBdU4nfgnWucHQgCrdjeA/exec";

    const input = document.getElementById('gameName');
    const dropdown = document.getElementById('bggResults');
    const form = document.getElementById('recordForm');
    const saveBtn = document.getElementById('saveBtn');
    const playDateInput = document.getElementById('playDate');
    const difficultyDisplay = document.getElementById('difficultyDisplay');
    const difficultyVal = document.getElementById('difficultyVal');
    const weightBadge = document.getElementById('weightBadge');

    // 오늘 날짜 세팅
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    playDateInput.value = `${yyyy}-${mm}-${dd}`;

    let debounceTimer = null;
    let currentSearchId = 0;

    // 타임아웃 지원 fetch
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 5000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    // 초고속 다중 프록시 파이프라인 (가장 응답이 빠른 프록시 순환)
    async function fetchBggXmlFast(targetUrl) {
      const encoded = encodeURIComponent(targetUrl);
      const proxies = [
        `https://corsproxy.io/?${encoded}`,
        `https://api.codetabs.com/v1/proxy?quest=${encoded}`,
        `https://api.allorigins.win/raw?url=${encoded}`
      ];

      for (const proxy of proxies) {
        try {
          const res = await fetchWithTimeout(proxy, { timeout: 4000 });
          if (res.ok) {
            const text = await res.text();
            if (text && text.includes("<items")) return text;
          }
        } catch (e) {
          // 다음 프록시로 즉시 시도
          continue;
        }
      }
      throw new Error("BGG 프록시 응답 실패");
    }

    // 1. 실시간 보드게임 검색
    async function searchBggApi(query) {
      const bggUrl = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
      const xmlText = await fetchBggXmlFast(bggUrl);

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = xmlDoc.getElementsByTagName("item");

      const results = [];
      const limit = Math.min(items.length, 10);

      for (let i = 0; i < limit; i++) {
        const item = items[i];
        const id = item.getAttribute("id");
        const nameEl = item.getElementsByTagName("name")[0];
        const yearEl = item.getElementsByTagName("yearpublished")[0];

        if (nameEl && id) {
          results.push({
            id: id,
            name: nameEl.getAttribute("value"),
            year: yearEl ? yearEl.getAttribute("value") : ""
          });
        }
      }

      return results;
    }

    // 2. 실시간 BGG 최신 Weight 조회
    async function fetchBggWeight(bggId) {
      const bggUrl = `https://boardgamegeek.com/xmlapi2/thing?id=${bggId}&stats=1`;
      const xmlText = await fetchBggXmlFast(bggUrl);

      // 전체 파싱 전 정규식으로 averageweight 값 즉시 추출 (DOM 파싱 지연 단축)
      const match = xmlText.match(/<averageweight\s+value="([^"]+)"/);
      if (match && match[1]) {
        const num = parseFloat(match[1]);
        if (!isNaN(num) && num > 0) {
          return num.toFixed(2);
        }
      }

      // 정규식 실패 시 표준 DOM 파서 시도
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const weightEl = xmlDoc.getElementsByTagName("averageweight")[0];
      if (weightEl) {
        const val = parseFloat(weightEl.getAttribute("value"));
        if (!isNaN(val) && val > 0) return val.toFixed(2);
      }

      return null;
    }

    // 게임 선택 시 처리
    async function selectGame(item) {
      input.value = item.name;
      dropdown.style.display = 'none';

      difficultyDisplay.value = "BGG 최신 Weight 조회 중...";
      weightBadge.innerText = "조회 중";

      if (!item.id) {
        difficultyDisplay.value = "난이도 정보 없음 (기본값 3점)";
        difficultyVal.value = "3";
        weightBadge.innerText = "기본값";
        return;
      }

      try {
        const weight = await fetchBggWeight(item.id);
        if (weight) {
          const parsed = parseFloat(weight);
          const rounded = Math.min(5, Math.max(1, Math.round(parsed)));
          
          difficultyDisplay.value = `${weight} / 5.0 점`;
          difficultyVal.value = String(rounded);
          weightBadge.innerText = `BGG 공식 (${rounded}점)`;
        } else {
          difficultyDisplay.value = "난이도 정보 없음 (기본값 3점)";
          difficultyVal.value = "3";
          weightBadge.innerText = "기본값";
        }
      } catch (err) {
        console.warn("난이도 실시간 로딩 실패:", err);
        difficultyDisplay.value = "연동 지연 (기본값 3점 처리)";
        difficultyVal.value = "3";
        weightBadge.innerText = "지연됨";
      }
    }

    // 드롭다운 렌더링
    function renderDropdownItems(list) {
      if (!list || list.length === 0) {
        dropdown.innerHTML = '<div class="bgg-status">검색 결과가 없습니다. (직접 입력 등록 가능)</div>';
        dropdown.style.display = 'block';
        return;
      }

      dropdown.innerHTML = '';
      const limit = Math.min(list.length, 8);

      for (let i = 0; i < limit; i++) {
        const item = list[i];
        const row = document.createElement("div");
        row.className = "bgg-item";
        row.innerHTML = `
          <span class="bgg-game-name">${escapeHtml(item.name)}</span>
          ${item.year ? `<span class="bgg-game-year">(${escapeHtml(item.year)})</span>` : ''}
        `;

        row.addEventListener("click", () => selectGame(item));
        dropdown.appendChild(row);
      }
      dropdown.style.display = 'block';
    }

    // 검색어 입력 이벤트
    input.addEventListener('input', function() {
      const q = this.value.trim();
      clearTimeout(debounceTimer);

      if (q.length === 0) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      dropdown.innerHTML = '<div class="bgg-status">BGG에서 실시간 검색 중...</div>';
      dropdown.style.display = 'block';

      const thisSearchId = ++currentSearchId;

      debounceTimer = setTimeout(async () => {
        try {
          const results = await searchBggApi(q);
          if (thisSearchId !== currentSearchId) return;
          renderDropdownItems(results);
        } catch (err) {
          if (thisSearchId !== currentSearchId) return;
          dropdown.innerHTML = '<div class="bgg-status">검색 결과를 불러오지 못했습니다. (직접 입력 가능)</div>';
        }
      }, 350);
    });

    // 드롭다운 바깥 클릭 시 닫기
    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // 스프레드시트 저장 (POST)
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const gameName = input.value.trim();
      const playDate = playDateInput.value;
      const players = document.querySelector('input[name="players"]:checked')?.value || "4";
      const difficulty = difficultyVal.value || "3";

      if (!gameName) {
        alert("보드게임명을 입력해 주세요.");
        return;
      }

      if (!playDate) {
        alert("플레이 날짜를 선택해 주세요.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            gameName: gameName,
            date: playDate,
            players: players,
            difficulty: difficulty
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("성공적으로 저장되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장 실패: " + (result.message || ""));
          saveBtn.disabled = false;
          saveBtn.innerText = "저장하기";
        }
      } catch (err) {
        alert("저장 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        saveBtn.disabled = false;
        saveBtn.innerText = "저장하기";
      }
    });

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
