<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 기록 작성 - My Shelf</title>
  <link rel="stylesheet" href="style.css?v=14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="sub-header glass-panel">
      <a href="index.html" class="nav-back">✕ 취소</a>
      <h1 class="sub-title">새 게임 등록</h1>
      <div class="header-dummy"></div>
    </header>

    <!-- 입력 폼 -->
    <main class="form-container">
      <form id="recordForm" class="glass-form-card">
        <!-- 1. 보드게임명 (BGG XML API2 다중 프록시 연동) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="gameName">보드게임명 (Title)</label>
            <span class="bgg-badge">BGG XML API2</span>
          </div>
          <div class="autocomplete-wrapper">
            <input 
              type="text" 
              id="gameName" 
              class="text-input glass-input" 
              placeholder="영문 입력 (예: Wingspan, Catan...)" 
              autocomplete="off"
              required
            >
            <div id="bggResults" class="bgg-dropdown" style="display: none;"></div>
          </div>
          <p class="input-tip">* 영문 2자 이상 입력 시 BoardGameGeek 공식 명칭이 추천됩니다.</p>
        </div>

        <!-- 2. 인원 (2인 ~ 8인) -->
        <div class="input-group">
          <label class="input-label">인원 (2인~8인)</label>
          <div class="chip-container">
            <label class="chip-item"><input type="radio" name="players" value="2"><span>2인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="3"><span>3인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="4" checked><span>4인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="5"><span>5인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="6"><span>6인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="7"><span>7인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="8"><span>8인</span></label>
          </div>
        </div>

        <!-- 3. 난이도 점수 (5점 만점) -->
        <div class="input-group">
          <label class="input-label">난이도 점수 (5점 만점)</label>
          <div class="score-card-group">
            <label class="score-card">
              <input type="radio" name="difficulty" value="1">
              <div class="score-box glass-score">
                <span class="score-digit">1</span>
                <span class="score-name">쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="2">
              <div class="score-box glass-score">
                <span class="score-digit">2</span>
                <span class="score-name">약간 쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="3" checked>
              <div class="score-box glass-score">
                <span class="score-digit">3</span>
                <span class="score-name">보통</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="4">
              <div class="score-box glass-score">
                <span class="score-digit">4</span>
                <span class="score-name">어려움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="5">
              <div class="score-box glass-score">
                <span class="score-digit">5</span>
                <span class="score-name">최상</span>
              </div>
            </label>
          </div>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="button-group">
          <a href="index.html" class="btn btn-cancel">취소</a>
          <button type="submit" id="saveBtn" class="btn btn-save">저장하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgnPKokcM9NsFcqbQ4M5f_6TuhWwVtEwPdS-hmO-E7jmIieHBdU4nfgnWucHQgCrdjeA/exec";

    const input = document.getElementById('gameName');
    const dropdown = document.getElementById('bggResults');
    const form = document.getElementById('recordForm');
    const saveBtn = document.getElementById('saveBtn');

    let debounceTimer = null;
    let currentController = null;

    // 1. 입력 감지 (350ms 대기 후 검색)
    input.addEventListener('input', function() {
      const query = this.value.trim();
      clearTimeout(debounceTimer);

      if (query.length < 2) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      debounceTimer = setTimeout(() => {
        executeBggSearch(query);
      }, 350);
    });

    // 2. 타임아웃 지원 fetch 래퍼
    async function fetchWithTimeout(url, options = {}, timeoutMs = 4500) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    // 3. 다중 프록시 폴백(Fallback) 검색 실행
    async function executeBggSearch(query) {
      if (currentController) {
        currentController.abort();
      }
      currentController = new AbortController();

      dropdown.innerHTML = '<div class="bgg-status">🔍 BGG XML API2 검색 중...</div>';
      dropdown.style.display = 'block';

      const bggTarget = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
      
      let xmlText = null;

      // 시도 1: corsproxy.io
      try {
        const p1 = `https://corsproxy.io/?${encodeURIComponent(bggTarget)}`;
        const r1 = await fetchWithTimeout(p1, {}, 4000);
        if (r1.ok) {
          xmlText = await r1.text();
        }
      } catch (e) {
        // 프록시 1 실패 시 다음으로 통과
      }

      // 시도 2: allorigins.win (1번 실패 시 작동)
      if (!xmlText) {
        try {
          const p2 = `https://api.allorigins.win/raw?url=${encodeURIComponent(bggTarget)}`;
          const r2 = await fetchWithTimeout(p2, {}, 4500);
          if (r2.ok) {
            xmlText = await r2.text();
          }
        } catch (e) {
          // 프록시 2 실패
        }
      }

      if (!xmlText) {
        dropdown.innerHTML = '<div class="bgg-status">검색 서버 연결이 지연되고 있습니다. 직접 입력해 주세요.</div>';
        return;
      }

      parseAndShowXml(xmlText);
    }

    // 4. XML 해석 및 목록 출력
    function parseAndShowXml(xmlString) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlString, "application/xml");
        const items = xmlDoc.getElementsByTagName("item");

        if (!items || items.length === 0) {
          dropdown.innerHTML = '<div class="bgg-status">일치하는 보드게임이 없습니다. 직접 입력하셔도 됩니다.</div>';
          return;
        }

        dropdown.innerHTML = '';
        const displayLimit = Math.min(items.length, 7);

        for (let i = 0; i < displayLimit; i++) {
          const item = items[i];

          // 1차 공식 명칭(type="primary") 우선 탐색
          let nameNode = item.querySelector('name[type="primary"]');
          if (!nameNode) {
            nameNode = item.getElementsByTagName("name")[0];
          }

          const yearNode = item.getElementsByTagName("yearpublished")[0];

          const title = nameNode ? (nameNode.getAttribute("value") || nameNode.textContent) : "";
          const year = yearNode ? (yearNode.getAttribute("value") || yearNode.textContent) : "";

          if (!title) continue;

          const row = document.createElement("div");
          row.className = "bgg-item";
          row.innerHTML = `
            <span class="bgg-game-name">${escapeHtml(title)}</span>
            ${year ? `<span class="bgg-game-year">(${escapeHtml(year)})</span>` : ''}
          `;

          // 클릭 시 자동완성 입력
          row.addEventListener("click", function() {
            input.value = title;
            dropdown.style.display = 'none';
          });

          dropdown.appendChild(row);
        }
      } catch (err) {
        dropdown.innerHTML = '<div class="bgg-status">결과 파싱 오류가 발생했습니다. 직접 입력해 주세요.</div>';
      }
    }

    // 바깥 영역 클릭 시 추천창 닫기
    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // 스프레드시트 저장 (POST)
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const gameName = input.value.trim();
      const players = document.querySelector('input[name="players"]:checked')?.value || "4";
      const difficulty = document.querySelector('input[name="difficulty"]:checked')?.value || "3";

      if (!gameName) {
        alert("보드게임명을 입력해 주세요.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            gameName: gameName,
            players: players,
            difficulty: difficulty
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("성공적으로 저장되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장 실패: " + (result.message || ""));
          saveBtn.disabled = false;
          saveBtn.innerText = "저장하기";
        }
      } catch (err) {
        alert("저장 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        saveBtn.disabled = false;
        saveBtn.innerText = "저장하기";
      }
    });

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
