<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 글 쓰기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>새 글 쓰기</h1>
      <a href="index.html" class="btn btn-secondary">목록으로</a>
    </header>

    <main>
      <form id="writeForm" class="form-card">
        <div class="form-group">
          <label for="title">제목</label>
          <input type="text" id="title" class="input-field" placeholder="제목을 입력하세요" required>
        </div>

        <div class="form-group">
          <label for="author">작성자</label>
          <input type="text" id="author" class="input-field" placeholder="작성자 이름" required>
        </div>

        <div class="form-group">
          <label for="content">내용</label>
          <textarea id="content" rows="8" class="input-field" placeholder="내용을 작성하세요"></textarea>
        </div>

        <div class="btn-group">
          <a href="index.html" class="btn btn-secondary">취소</a>
          <button type="submit" id="submitBtn" class="btn btn-primary">등록하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const form = document.getElementById("writeForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const title = document.getElementById("title").value.trim();
      const author = document.getElementById("author").value.trim();
      const content = document.getElementById("content").value.trim();

      submitBtn.disabled = true;
      submitBtn.innerText = "저장 중...";

      try {
        const response = await fetch("/api/posts", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ title, author, content }),
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("성공적으로 게시되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장 실패: " + result.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "등록하기";
        }
      } catch (err) {
        alert("통신 중 오류가 발생했습니다.");
        submitBtn.disabled = false;
        submitBtn.innerText = "등록하기";
      }
    });
  </script>
</body>
</html>
