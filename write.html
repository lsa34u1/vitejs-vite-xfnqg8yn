<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 기록 작성 - My Shelf</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 헤더 -->
    <header class="sub-header glass-panel">
      <a href="index.html" class="nav-back">✕ 취소</a>
      <h1 class="sub-title">새 게임 등록</h1>
      <div class="header-dummy"></div>
    </header>

    <!-- 입력 폼 -->
    <main class="form-container">
      <form id="recordForm" class="glass-form-card">
        <!-- 1. 플레이 날짜 입력 (기본값 오늘) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="playDate">플레이 날짜 (Date)</label>
            <span class="bgg-badge">기본 오늘</span>
          </div>
          <input 
            type="date" 
            id="playDate" 
            class="text-input glass-input" 
            required
          >
          <p class="input-tip">* 기본으로 오늘 날짜가 지정되며, 필요 시 변경할 수 있습니다.</p>
        </div>

        <!-- 2. 보드게임명 (실시간 BGG API 연동 자동완성) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="gameName">보드게임명 (Title)</label>
            <span class="bgg-badge">BGG 공식 DB</span>
          </div>
          <div class="autocomplete-wrapper">
            <input 
              type="text" 
              id="gameName" 
              class="text-input glass-input" 
              placeholder="영문 명칭 입력 (예: SETI, Brass, Catan...)" 
              autocomplete="off"
              required
            >
            <div id="bggResults" class="bgg-dropdown" style="display: none;"></div>
          </div>
          <p class="input-tip">* 목록에서 게임을 선택하면 BGG Weight(난이도)가 자동 입력됩니다.</p>
        </div>

        <!-- 3. 인원 (2인 ~ 8인) -->
        <div class="input-group">
          <label class="input-label">인원 (2인~8인)</label>
          <div class="chip-container">
            <label class="chip-item"><input type="radio" name="players" value="2"><span>2인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="3"><span>3인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="4" checked><span>4인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="5"><span>5인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="6"><span>6인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="7"><span>7인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="8"><span>8인</span></label>
          </div>
        </div>

        <!-- 4. BGG 자동 난이도 (BGG Weight 불러오기) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="difficultyDisplay">난이도 (BGG Weight / 5.0 만점)</label>
            <span class="bgg-badge" id="weightBadge">자동 측정</span>
          </div>
          <input 
            type="text" 
            id="difficultyDisplay" 
            class="text-input glass-input" 
            placeholder="게임을 선택하면 자동으로 계산됩니다" 
            readonly
            style="cursor: default; font-weight: 600; color: #1e293b;"
          >
          <input type="hidden" id="difficultyVal" name="difficulty" value="3">
          <p class="input-tip" id="weightDesc">* BGG 커뮤니티의 공식 복잡도(Weight) 지수입니다.</p>
        </div>

        <!-- 하단 액션 버튼 -->
        <div class="button-group">
          <a href="index.html" class="btn btn-cancel">취소</a>
          <button type="submit" id="saveBtn" class="btn btn-save">저장하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgnPKokcM9NsFcqbQ4M5f_6TuhWwVtEwPdS-hmO-E7jmIieHBdU4nfgnWucHQgCrdjeA/exec";

    // 기본 로컬 캐시 데이터 (BGG ID 매핑)
    const LOCAL_FALLBACK_DB = [
      { id: "266192", name: "Wingspan", year: "2019" },
      { id: "13", name: "Catan", year: "1995" },
      { id: "167791", name: "Terraforming Mars", year: "2016" },
      { id: "148228", name: "Splendor", year: "2014" },
      { id: "295947", name: "Cascadia", year: "2021" },
      { id: "414317", name: "Harmonies", year: "2024" },
      { id: "418059", name: "SETI: Search for Extraterrestrial Intelligence", year: "2024" },
      { id: "177303", name: "National Economy", year: "2015" },
      { id: "224517", name: "Brass: Birmingham", year: "2018" },
      { id: "342942", name: "Ark Nova", year: "2021" },
      { id: "316554", name: "Dune: Imperium", year: "2020" },
      { id: "174430", name: "Gloomhaven", year: "2017" },
      { id: "291457", name: "Gloomhaven: Jaws of the Lion", year: "2020" },
      { id: "162886", name: "Spirit Island", year: "2017" },
      { id: "193738", name: "Great Western Trail", year: "2016" },
      { id: "291453", name: "Scout", year: "2019" },
      { id: "84876", name: "The Castles of Burgundy", year: "2011" },
      { id: "124361", name: "Concordia", year: "2013" },
      { id: "312484", name: "Lost Ruins of Arnak", year: "2020" },
      { id: "230802", name: "Azul", year: "2017" },
      { id: "173346", name: "7 Wonders Duel", year: "2015" },
      { id: "68448", name: "7 Wonders", year: "2010" },
      { id: "366013", name: "Heat: Pedal to the Metal", year: "2022" },
      { id: "237182", name: "Root", year: "2018" },
      { id: "284083", name: "The Crew: The Quest for Planet Nine", year: "2019" },
      { id: "324856", name: "The Crew: Mission Deep Sea", year: "2021" },
      { id: "822", name: "Carcassonne", year: "2000" },
      { id: "30549", name: "Pandemic", year: "2008" },
      { id: "161936", name: "Pandemic Legacy: Season 1", year: "2015" },
      { id: "201808", name: "Clank!: A Deck-Building Adventure", year: "2016" },
      { id: "365717", name: "Clank! Catacombs", year: "2022" },
      { id: "31260", name: "Agricola", year: "2007" },
      { id: "163412", name: "Patchwork", year: "2014" },
      { id: "199792", name: "Everdell", year: "2018" },
      { id: "170216", name: "Blood Rage", year: "2015" },
      { id: "169786", name: "Scythe", year: "2016" },
      { id: "183394", name: "Viticulture Essential Edition", year: "2015" },
      { id: "166384", name: "Nemesis", year: "2018" },
      { id: "256960", name: "Pax Pamir: Second Edition", year: "2019" },
      { id: "126163", name: "Tzolk'in: The Mayan Calendar", year: "2012" },
      { id: "157354", name: "Five Tribes", year: "2014" },
      { id: "177736", name: "A Feast for Odin", year: "2016" },
      { id: "2651", name: "Power Grid", year: "2004" },
      { id: "171", name: "Puerto Rico", year: "2002" },
      { id: "36218", name: "Dominion", year: "2008" },
      { id: "9209", name: "Ticket to Ride", year: "2004" },
      { id: "14996", name: "Ticket to Ride: Europe", year: "2005" },
      { id: "129622", name: "Love Letter", year: "2012" },
      { id: "128882", name: "The Resistance: Avalon", year: "2012" },
      { id: "172386", name: "Secret Hitler", year: "2016" },
      { id: "178900", name: "Codenames", year: "2015" },
      { id: "224037", name: "Codenames: Duet", year: "2017" },
      { id: "39856", name: "Dixit", year: "2008" },
      { id: "254640", name: "Just One", year: "2018" },
      { id: "245654", name: "Decrypto", year: "2018" },
      { id: "83195", name: "Skull", year: "2011" },
      { id: "359970", name: "Challengers!", year: "2022" },
      { id: "367220", name: "Sea Salt & Paper", year: "2022" },
      { id: "356770", name: "Trio", year: "2021" },
      { id: "370591", name: "Dorfromantik: The Board Game", year: "2022" },
      { id: "357924", name: "Earth", year: "2023" },
      { id: "340466", name: "Darwin's Journey", year: "2023" },
      { id: "205637", name: "Arkham Horror: The Card Game", year: "2016" },
      { id: "285774", name: "Marvel Champions: The Card Game", year: "2019" },
      { id: "205059", name: "Mansions of Madness: Second Edition", year: "2016" },
      { id: "274637", name: "Unmatched: Battle of Legends, Volume One", year: "2019" },
      { id: "811", name: "Rummikub", year: "1977" },
      { id: "2932", name: "Halli Galli", year: "1990" },
      { id: "3955", name: "Bang!", year: "2002" },
      { id: "11", name: "Bohnanza", year: "1997" },
      { id: "1294", name: "Clue", year: "1949" },
      { id: "7021", name: "Coda", year: "2002" }
    ];

    const input = document.getElementById('gameName');
    const dropdown = document.getElementById('bggResults');
    const form = document.getElementById('recordForm');
    const saveBtn = document.getElementById('saveBtn');
    const playDateInput = document.getElementById('playDate');
    const difficultyDisplay = document.getElementById('difficultyDisplay');
    const difficultyVal = document.getElementById('difficultyVal');
    const weightBadge = document.getElementById('weightBadge');

    // 오늘 날짜를 YYYY-MM-DD 포맷으로 기본값 세팅
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    playDateInput.value = `${yyyy}-${mm}-${dd}`;

    let debounceTimer = null;
    let currentSearchId = 0;

    // 타임아웃 지원 fetch
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 3500 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(id);
        return response;
      } catch (err) {
        clearTimeout(id);
        throw err;
      }
    }

    // BGG 프록시 공통 fetch
    async function fetchBggXml(url) {
      try {
        const proxy1 = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
        const res = await fetchWithTimeout(proxy1, { timeout: 3500 });
        if (res.ok) {
          const json = await res.json();
          if (json.contents) return json.contents;
        }
      } catch (e) {}

      try {
        const proxy2 = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`;
        const res = await fetchWithTimeout(proxy2, { timeout: 3500 });
        if (res.ok) {
          return await res.text();
        }
      } catch (err2) {}

      throw new Error("BGG 프록시 요청 실패");
    }

    // 1. 보드게임 검색 API
    async function searchBggApi(query) {
      const bggUrl = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
      const xmlText = await fetchBggXml(bggUrl);

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const items = xmlDoc.getElementsByTagName("item");

      const results = [];
      const limit = Math.min(items.length, 12);

      for (let i = 0; i < limit; i++) {
        const item = items[i];
        const id = item.getAttribute("id");
        const nameEl = item.getElementsByTagName("name")[0];
        const yearEl = item.getElementsByTagName("yearpublished")[0];

        if (nameEl && id) {
          results.push({
            id: id,
            name: nameEl.getAttribute("value"),
            year: yearEl ? yearEl.getAttribute("value") : ""
          });
        }
      }

      return results;
    }

    // 2. BGG Weight(난이도) 조회 API
    async function fetchBggWeight(bggId) {
      const bggUrl = `https://boardgamegeek.com/xmlapi2/thing?id=${bggId}&stats=1`;
      const xmlText = await fetchBggXml(bggUrl);

      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, "text/xml");
      const weightEl = xmlDoc.getElementsByTagName("averageweight")[0];

      if (weightEl) {
        const rawWeight = parseFloat(weightEl.getAttribute("value"));
        if (!isNaN(rawWeight) && rawWeight > 0) {
          return rawWeight.toFixed(2);
        }
      }
      return null;
    }

    // 게임 선택 처리
    async function selectGame(item) {
      input.value = item.name;
      dropdown.style.display = 'none';

      difficultyDisplay.value = "BGG Weight 조회 중...";
      weightBadge.innerText = "조회 중";

      if (!item.id) {
        difficultyDisplay.value = "난이도 정보 없음 (기본값 3)";
        difficultyVal.value = "3";
        weightBadge.innerText = "수동";
        return;
      }

      try {
        const weight = await fetchBggWeight(item.id);
        if (weight) {
          difficultyDisplay.value = `${weight} / 5.0 점`;
          const rounded = Math.min(5, Math.max(1, Math.round(parseFloat(weight))));
          difficultyVal.value = String(rounded);
          weightBadge.innerText = `BGG 공식 (난이도 ${rounded}점)`;
        } else {
          difficultyDisplay.value = "난이도 데이터 없음 (기본값 3)";
          difficultyVal.value = "3";
          weightBadge.innerText = "기본값";
        }
      } catch (err) {
        console.warn("난이도 불러오기 실패:", err);
        difficultyDisplay.value = "불러오기 실패 (기본값 3)";
        difficultyVal.value = "3";
        weightBadge.innerText = "기본값";
      }
    }

    // 드롭다운 렌더링
    function renderDropdownItems(list) {
      if (!list || list.length === 0) {
        dropdown.innerHTML = '<div class="bgg-status">검색 결과가 없습니다. (직접 입력 등록 가능)</div>';
        dropdown.style.display = 'block';
        return;
      }

      dropdown.innerHTML = '';
      const limit = Math.min(list.length, 8);

      for (let i = 0; i < limit; i++) {
        const item = list[i];
        const row = document.createElement("div");
        row.className = "bgg-item";
        row.innerHTML = `
          <span class="bgg-game-name">${escapeHtml(item.name)}</span>
          ${item.year ? `<span class="bgg-game-year">(${escapeHtml(item.year)})</span>` : ''}
        `;

        row.addEventListener("click", () => selectGame(item));
        dropdown.appendChild(row);
      }
      dropdown.style.display = 'block';
    }

    // 입력 감지
    input.addEventListener('input', function() {
      const q = this.value.trim();
      clearTimeout(debounceTimer);

      if (q.length === 0) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      const lowerQ = q.toLowerCase();
      const localMatches = LOCAL_FALLBACK_DB.filter(game => 
        game.name.toLowerCase().includes(lowerQ)
      );

      if (localMatches.length > 0) {
        renderDropdownItems(localMatches);
      } else {
        dropdown.innerHTML = '<div class="bgg-status">BGG에서 실시간 검색 중...</div>';
        dropdown.style.display = 'block';
      }

      const thisSearchId = ++currentSearchId;

      debounceTimer = setTimeout(async () => {
        let apiResults = [];

        try {
          apiResults = await searchBggApi(q);
        } catch (err) {
          console.warn("실시간 API 조회 실패, 현재 결과 유지:", err);
        }

        if (thisSearchId !== currentSearchId) return;

        const combined = [...apiResults];

        localMatches.forEach(loc => {
          if (!combined.some(c => c.name.toLowerCase() === loc.name.toLowerCase())) {
            combined.unshift(loc);
          }
        });

        renderDropdownItems(combined);
      }, 300);
    });

    // 드롭다운 바깥 영역 클릭 닫기
    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // 스프레드시트 저장 (POST)
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const gameName = input.value.trim();
      const playDate = playDateInput.value;
      const players = document.querySelector('input[name="players"]:checked')?.value || "4";
      const difficulty = difficultyVal.value || "3";

      if (!gameName) {
        alert("보드게임명을 입력해 주세요.");
        return;
      }

      if (!playDate) {
        alert("플레이 날짜를 선택해 주세요.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            gameName: gameName,
            date: playDate,
            players: players,
            difficulty: difficulty
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("성공적으로 저장되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장 실패: " + (result.message || ""));
          saveBtn.disabled = false;
          saveBtn.innerText = "저장하기";
        }
      } catch (err) {
        alert("저장 통신 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        saveBtn.disabled = false;
        saveBtn.innerText = "저장하기";
      }
    });

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
