<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 기록 작성 - My Shelf</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 서브 페이지 헤더 -->
    <header class="sub-header">
      <a href="index.html" class="nav-back">✕ 취소</a>
      <h1 class="sub-title">기록 추가</h1>
      <div class="header-dummy"></div>
    </header>

    <!-- 작성 폼 -->
    <main class="form-container">
      <form id="recordForm">
        <!-- 1. 보드게임명 (BGG 자동완성 검색) -->
        <div class="input-group">
          <div class="label-with-source">
            <label class="input-label" for="gameName">보드게임명</label>
            <span class="bgg-badge">BGG 연동</span>
          </div>
          <div class="autocomplete-wrapper">
            <input 
              type="text" 
              id="gameName" 
              class="text-input" 
              placeholder="영문 또는 한글 게임명 입력 (예: Catan)" 
              autocomplete="off"
              required
            >
            <div id="bggResults" class="bgg-dropdown" style="display: none;"></div>
          </div>
          <p class="input-tip">* 보드게임긱(BoardGameGeek) 공식 명칭 목록이 추천됩니다.</p>
        </div>

        <!-- 2. 플레이 인원 (2인 ~ 8인) -->
        <div class="input-group">
          <label class="input-label">인원 (2인~8인)</label>
          <div class="chip-container">
            <label class="chip-item"><input type="radio" name="players" value="2"><span>2인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="3"><span>3인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="4" checked><span>4인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="5"><span>5인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="6"><span>6인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="7"><span>7인</span></label>
            <label class="chip-item"><input type="radio" name="players" value="8"><span>8인</span></label>
          </div>
        </div>

        <!-- 3. 난이도 점수 (5점 만점) -->
        <div class="input-group">
          <label class="input-label">난이도 점수 (5점 만점)</label>
          <div class="score-card-group">
            <label class="score-card">
              <input type="radio" name="difficulty" value="1">
              <div class="score-box">
                <span class="score-digit">1</span>
                <span class="score-name">매우 쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="2">
              <div class="score-box">
                <span class="score-digit">2</span>
                <span class="score-name">쉬움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="3" checked>
              <div class="score-box">
                <span class="score-digit">3</span>
                <span class="score-name">보통</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="4">
              <div class="score-box">
                <span class="score-digit">4</span>
                <span class="score-name">어려움</span>
              </div>
            </label>
            <label class="score-card">
              <input type="radio" name="difficulty" value="5">
              <div class="score-box">
                <span class="score-digit">5</span>
                <span class="score-name">매우 어려움</span>
              </div>
            </label>
          </div>
        </div>

        <!-- 하단 버튼 -->
        <div class="button-group">
          <a href="index.html" class="btn btn-cancel">취소</a>
          <button type="submit" id="saveBtn" class="btn btn-save" style="border: none;">저장하기</button>
        </div>
      </form>
    </main>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbybHJcSgR0ZyDOptjjZQUe2eYueDalbRK95z-25jmA1O3TWnCpdPBErHc_HionBNWSKuQ/exec";

    // BGG 자동완성 검색 기능
    const input = document.getElementById('gameName');
    const dropdown = document.getElementById('bggResults');
    let timer = null;

    input.addEventListener('input', function() {
      const query = this.value.trim();
      clearTimeout(timer);

      if (query.length < 2) {
        dropdown.style.display = 'none';
        dropdown.innerHTML = '';
        return;
      }

      timer = setTimeout(() => {
        searchBGG(query);
      }, 400);
    });

    async function searchBGG(query) {
      dropdown.innerHTML = '<div class="bgg-status">BGG 검색 중...</div>';
      dropdown.style.display = 'block';

      try {
        const bggApiUrl = `https://boardgamegeek.com/xmlapi2/search?query=${encodeURIComponent(query)}&type=boardgame`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(bggApiUrl)}`;

        const response = await fetch(proxyUrl);
        const xmlText = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "application/xml");

        const items = xmlDoc.getElementsByTagName("item");
        dropdown.innerHTML = '';

        if (items.length === 0) {
          dropdown.innerHTML = '<div class="bgg-status">검색 결과가 없습니다.</div>';
          return;
        }

        const maxResults = Math.min(items.length, 6);
        for (let i = 0; i < maxResults; i++) {
          const item = items[i];
          const nameElem = item.getElementsByTagName("name")[0];
          const yearElem = item.getElementsByTagName("yearpublished")[0];

          const name = nameElem ? nameElem.getAttribute("value") : "알 수 없음";
          const year = yearElem ? yearElem.getAttribute("value") : "";

          const option = document.createElement("div");
          option.className = "bgg-item";
          option.innerHTML = `
            <span class="bgg-game-name">${name}</span>
            ${year ? `<span class="bgg-game-year">(${year})</span>` : ''}
          `;

          option.addEventListener("click", function() {
            input.value = name;
            dropdown.style.display = 'none';
          });

          dropdown.appendChild(option);
        }
      } catch (error) {
        dropdown.innerHTML = '<div class="bgg-status">검색 오류가 발생했습니다. 직접 입력해 주세요.</div>';
      }
    }

    document.addEventListener('click', function(e) {
      if (!input.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    // 스프레드시트에 저장 (POST 요청)
    const form = document.getElementById('recordForm');
    const saveBtn = document.getElementById('saveBtn');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const gameName = input.value.trim();
      const players = document.querySelector('input[name="players"]:checked')?.value || "4";
      const difficulty = document.querySelector('input[name="difficulty"]:checked')?.value || "3";

      if (!gameName) {
        alert("보드게임명을 입력해 주세요.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "저장 중...";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            gameName: gameName,
            players: players,
            difficulty: difficulty
          })
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("저장되었습니다!");
          window.location.href = "index.html";
        } else {
          alert("저장에 실패했습니다: " + (result.message || ""));
          saveBtn.disabled = false;
          saveBtn.innerText = "저장하기";
        }
      } catch (err) {
        alert("통신 중 오류가 발생했습니다.");
        saveBtn.disabled = false;
        saveBtn.innerText = "저장하기";
      }
    });
  </script>
</body>
</html>
