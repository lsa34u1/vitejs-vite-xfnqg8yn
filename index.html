<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 보드게임 다이어리 (My Shelf)</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="header glass-panel">
      <div class="logo-area">
        <h1 class="logo-title">My Shelf</h1>
      </div>
      <div class="user-badge">ME</div>
    </header>

    <!-- 검색 및 필터 바 -->
    <section class="filter-section">
      <div class="search-box glass-input">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search games in this shelf...">
      </div>

      <div class="filter-row">
        <div class="select-wrapper glass-select">
          <select id="playerFilter">
            <option value="">인원 전체</option>
            <option value="2">2인</option>
            <option value="3">3인</option>
            <option value="4">4인</option>
            <option value="5">5인</option>
            <option value="6">6인</option>
            <option value="7">7인</option>
            <option value="8">8인</option>
          </select>
        </div>

        <div class="select-wrapper glass-select">
          <select id="difficultyFilter">
            <option value="">난이도 전체</option>
            <option value="1">난이도 1점</option>
            <option value="2">난이도 2점</option>
            <option value="3">난이도 3점</option>
            <option value="4">난이도 4점</option>
            <option value="5">난이도 5점</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 2열 격자 선반 피드 -->
    <main class="grid-shelf" id="cardList">
      <div class="status-msg">기록을 불러오는 중입니다...</div>
    </main>

    <!-- 플로팅 액션 버튼 (+) -->
    <a href="write.html" class="fab-btn" aria-label="기록 추가">
      <span>+</span>
    </a>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwgnPKokcM9NsFcqbQ4M5f_6TuhWwVtEwPdS-hmO-E7jmIieHBdU4nfgnWucHQgCrdjeA/exec";
    
    let allRecords = [];

    const cardList = document.getElementById('cardList');
    const searchInput = document.getElementById('searchInput');
    const playerFilter = document.getElementById('playerFilter');
    const difficultyFilter = document.getElementById('difficultyFilter');

    // 시간 문자열(T, 시:분:초, Z 등)을 완전히 제거하고 YYYY.MM.DD만 반환하는 함수
    function formatDateOnly(dateVal) {
      if (!dateVal) return "";
      const str = String(dateVal).trim();
      
      const match = str.match(/\d{4}[-./]\d{1,2}[-./]\d{1,2}/);
      if (match) {
        return match[0].replace(/[-/]/g, '.');
      }
      
      return str.split('T')[0].split(' ')[0].substring(0, 10);
    }

    // Google 스프레드시트 데이터 조회
    async function fetchRecords() {
      try {
        const res = await fetch(API_URL);
        const json = await res.json();

        if (json.status === "success") {
          allRecords = json.data.reverse();
          renderCards(allRecords);
        } else {
          cardList.innerHTML = '<div class="status-msg status-err">데이터를 불러오는 데 실패했습니다.</div>';
        }
      } catch (err) {
        cardList.innerHTML = '<div class="status-msg status-err">기록을 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.</div>';
      }
    }

    // 카드 목록 렌더링 (사진 제거 및 순수 날짜 표기)
    function renderCards(records) {
      if (records.length === 0) {
        cardList.innerHTML = '<div class="status-msg">기록된 보드게임이 없습니다.</div>';
        return;
      }

      cardList.innerHTML = records.map(item => {
        const diffNum = parseInt(item.difficulty, 10) || 0;
        const stars = "★".repeat(diffNum) + "☆".repeat(Math.max(0, 5 - diffNum));
        const pureDate = formatDateOnly(item.date);
        
        return `
          <article class="grid-card glass-card">
            <div class="card-header-clean">
              <span class="badge-tag">난이도 ${item.difficulty}</span>
              <span class="stars-clean">${stars}</span>
            </div>
            <div class="card-content-clean">
              <h2 class="game-title-clean">${escapeHtml(item.gameName)}</h2>
              <div class="meta-list-clean">
                <div class="meta-clean-row">
                  <span class="meta-clean-label">인원</span>
                  <span class="meta-clean-val">${escapeHtml(item.players)}인</span>
                </div>
                <div class="meta-clean-row">
                  <span class="meta-clean-label">날짜</span>
                  <span class="meta-clean-val">${escapeHtml(pureDate)}</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // 실시간 검색 및 필터링 로직
    function applyFilter() {
      const query = searchInput.value.toLowerCase().trim();
      const pVal = playerFilter.value;
      const dVal = difficultyFilter.value;

      const filtered = allRecords.filter(item => {
        const matchesName = !query || String(item.gameName).toLowerCase().includes(query);
        const matchesPlayer = !pVal || String(item.players) === String(pVal);
        const matchesDiff = !dVal || String(item.difficulty) === String(dVal);
        return matchesName && matchesPlayer && matchesDiff;
      });

      renderCards(filtered);
    }

    searchInput.addEventListener('input', applyFilter);
    playerFilter.addEventListener('change', applyFilter);
    difficultyFilter.addEventListener('change', applyFilter);

    function escapeHtml(text) {
      if (!text) return "";
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    fetchRecords();
  </script>
</body>
</html>
