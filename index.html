<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion 게시판</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>게시판</h1>
      <a href="write.html" class="btn btn-primary">글쓰기</a>
    </header>

    <main>
      <div id="loading" class="status-msg">게시글을 불러오는 중입니다...</div>
      <table class="board-table" id="boardTable" style="display: none;">
        <thead>
          <tr>
            <th style="width: 55%;">제목</th>
            <th style="width: 25%;">작성자</th>
            <th style="width: 20%;">작성일</th>
          </tr>
        </thead>
        <tbody id="postList"></tbody>
      </table>
    </main>
  </div>

  <script>
    async function fetchPosts() {
      const loadingEl = document.getElementById("loading");
      const tableEl = document.getElementById("boardTable");
      const postListEl = document.getElementById("postList");

      try {
        const response = await fetch("/api/posts");
        const json = await response.json();

        if (json.status === "success") {
          loadingEl.style.display = "none";
          tableEl.style.display = "table";

          if (json.data.length === 0) {
            postListEl.innerHTML = `<tr><td colspan="3" style="text-align:center;">작성된 게시글이 없습니다.</td></tr>`;
            return;
          }

          postListEl.innerHTML = json.data.map(post => `
            <tr>
              <td>
                <a href="detail.html?id=${post.id}" class="post-title-link">${escapeHtml(post.title)}</a>
              </td>
              <td>${escapeHtml(post.author)}</td>
              <td>${escapeHtml(post.date)}</td>
            </tr>
          `).join("");
        } else {
          loadingEl.innerText = "데이터를 불러오는 데 실패했습니다: " + json.message;
        }
      } catch (err) {
        loadingEl.innerText = "서버 통신 오류가 발생했습니다.";
      }
    }

    function escapeHtml(text) {
      if (!text) return "";
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    fetchPosts();
  </script>
</body>
</html>
